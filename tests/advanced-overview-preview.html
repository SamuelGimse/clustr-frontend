<!doctype html><html lang="en" data-theme="dark" data-view-mode="advanced"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced overview · sample data</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../dashboard/dashboard.css"><link rel="stylesheet" href="../simple-selected.css"><style>body{margin:0;padding:20px;background:#101820;color:#e7f1ed;--bg:#101820;--border:#2b3a41;--panel:#101c24;--panel-2:#14232c;--text:#e7f1ed;--text-meta:#9aaeb2;--accent:#80dfc4;--up:#7dd9ab;--down:#ed8585;font:14px system-ui}.fixture{display:flex;gap:16px;align-items:center;font:11px system-ui;color:#9aaeb2}.fixture button{padding:8px;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px}@media(max-width:600px){body{padding:8px}}</style></head><body><div class="fixture">SAMPLE DATA · ADVANCED OVERVIEW PREVIEW <button id="mode">Switch to Simple</button></div><section id="dashboardView"></section><script src="../js/cluster-taxonomy.js"></script><script src="../js/util.js"></script><script src="../atlas/atlas.js"></script><script src="../connections/connections.js"></script><script src="../connections/canvas.js"></script><script src="../dashboard/regression.js"></script><script src="../dashboard/workspace.js"></script><script src="../dashboard/dashboard.js"></script><script>
const names=['Artificial Intelligence','Semiconductors','Energy supply','Shipping & trade','US interest rates','Banking & finance','Nuclear energy','Clean energy'],symbols=['AAPL','NVDA','AMD','MSFT','JPM'];
const publishes=Array.from({length:14},(_,i)=>({id:i+1,market:'US',created_at:new Date(Date.UTC(2026,9,27+i,20)).toISOString()}));
const groups=new Map(publishes.map((p,i)=>[String(p.id),names.map((name,j)=>({name,stance_score:Math.sin(i*.4+j)*5,market:'US',mentioned_stocks:[{symbol:symbols[j%5],name:['Apple','NVIDIA','AMD','Microsoft','JPMorgan'][j%5],priceAtPublish:100+j*15+i*2+Math.sin(i)*5}],articles:Array.from({length:3+j%3},(_,k)=>({title:['Companies report new infrastructure investment','New policy moves supply chains','Demand forecasts shift across markets'][k%3]+' · '+name,source:['Reuters','Bloomberg','CNBC','FT'][k%4],rating:Math.round(Math.sin(i+j+k)*5),date:new Date(Date.parse(p.created_at)-3600000*(k*10+j)).toISOString(),link:'https://example.com/'+i+'/'+j+'/'+k,mentioned_companies:[{symbol:symbols[j%5]}]}))}))]));
window.ClustrApi={fetchAllPublishes:async()=>publishes,loadGroupsForPublish:async p=>groups.get(String(p.id))};
window.ClustrWatchlist={getItems:()=>symbols.map(symbol=>({symbol,market:'US'})),linkedGroups:rows=>rows,filterGroupMap:g=>g};
const host=document.getElementById('dashboardView');const nav=()=>{};ClustrDashboard.render(host,nav);
document.getElementById('mode').onclick=()=>{const advanced=document.documentElement.dataset.viewMode==='advanced';document.documentElement.dataset.viewMode=advanced?'simple':'advanced';document.getElementById('mode').textContent=advanced?'Switch to Advanced':'Switch to Simple';ClustrDashboard.render(host,nav);};
</script></body></html>
