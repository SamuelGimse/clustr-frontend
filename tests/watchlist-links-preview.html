<!doctype html><html lang="en" data-theme="apple" data-color-mode="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watchlist link filters test</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../watchlist.css"><link rel="stylesheet" href="../dashboard/dashboard.css"><style>body{padding:24px}main{max-width:1200px;margin:auto}.fixture{font:11px monospace;color:var(--text-meta)}@media(max-width:600px){body{padding:12px}}</style></head><body><main><p class="fixture">TEST FIXTURE — SAMPLE REPORTS AND NVDA WATCHLIST, NO ACCOUNT REQUESTS</p>

{name:'Robotics',stance_score:2,original_stocks:[stock]},
