<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Footer logo theme check</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../footer.css"><style>body{display:block}.footer-check{max-width:900px;margin:24px auto;padding:20px}.footer-check select{padding:8px;background:var(--panel);color:var(--text);border:1px solid var(--border)}.footer-check .technology-credits{gap:16px 24px}</style></head><body><main class="footer-check"><h1>Footer logo check</h1><label>Theme <select id="theme"><option value="dark">Dark</option><option value="minimal">Light</option><option value="coral-navy">Coral / navy</option><option value="berry-mint">Berry / mint</option></select></label><div id="footerMount"></div></main><script>
(async()=>{const source=new DOMParser().parseFromString(await(await fetch('../index.html')).text(),'text/html');document.querySelector('#footerMount').append(source.querySelector('.app-footer'));document.querySelector('#theme').addEventListener('change',event=>{document.documentElement.dataset.theme=event.target.value;});})();
</script></body></html>
