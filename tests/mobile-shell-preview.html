<!doctype html><html lang="en" data-theme="dark" data-view-mode="simple"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Selected Simple layouts — sample data</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="stocks.css"><link rel="stylesheet" href="atlas/atlas.css"><link rel="stylesheet" href="vendor/gridstack-14.1.0/gridstack.min.css"><link rel="stylesheet" href="dashboard/dashboard.css"><link rel="stylesheet" href="connections/connections.css"><link rel="stylesheet" href="world.css"><link rel="stylesheet" href="watchlist.css"><link rel="stylesheet" href="view-mode.css"><link rel="stylesheet" href="simple-selected.css">
<style>body{display:block;margin:0}.main{margin:0!important;width:100%;max-width:1500px;padding:18px!important}.preview-nav{display:flex;flex-wrap:wrap;gap:8px;padding:12px;font:12px Arial}.preview-nav button{padding:8px;background:var(--panel);border:1px solid var(--border);color:var(--text)}.preview-nav strong{padding:8px;color:var(--text-meta)}[hidden]{display:none!important}</style><link rel="stylesheet" href="mobile.css"><style>@media(max-width:768px){.preview-nav{display:flex;flex-wrap:nowrap;overflow:auto;max-width:100%;position:static!important;}.top-app-bar .meta:empty::after{content:"US · Nov 9 / 3 PM ET";}}</style></head><body>
<nav class="preview-nav"><strong>SAMPLE DATA / UI CHECK</strong><button data-preview="dashboard">Overview</button><button data-preview="events">News</button><button data-preview="stocks">Stocks</button><button data-preview="connections">Network</button><button data-preview="map">World</button><button data-preview="weekly">Trends</button><button data-preview="atlas">History</button><button data-preview="days">Reports</button><button data-preview="watchlist">Watchlist</button></nav>
<main class="main" id="main"><header class="top-app-bar">
        <button type="button" id="burgerBtn" class="burger-btn" aria-label="Open menu" aria-expanded="false" aria-controls="side"><span class="burger-lines" aria-hidden="true"><span></span><span></span><span></span></span><span class="burger-label" aria-hidden="true">Menu</span><span class="pro-badge dock-pro-badge" data-pro-badge data-pro-compact hidden></span></button>
        <div class="publish-nav" aria-label="Publish navigation">
          <button type="button" id="prevPublishBtn" class="md-btn md-btn--icon" title="Older publish" aria-label="Older publish">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M15 6l-6 6 6 6"/>
            </svg>
          </button>
          <div id="meta" class="meta" aria-live="polite"></div>
          <button type="button" id="nextPublishBtn" class="md-btn md-btn--icon" title="Newer publish" aria-label="Newer publish">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M9 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
        <button type="button" id="eventSortToggle" class="md-btn md-btn--icon events-sort-trigger" aria-label="Sort clusters" aria-expanded="false" aria-controls="eventSortOptions"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h12M4 12h8M4 18h4M19 5v14m-3-3 3 3 3-3"/></svg></button>
        <details id="mobileViewOptions" class="mobile-view-options" hidden><summary aria-label="View options"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6m6 4v6"/></svg><span>View</span></summary><div class="mobile-view-popover"><h2>View options</h2><div data-mobile-mode-slot></div><section data-mobile-sort-slot><h3>Sort clusters</h3></section></div></details>
        <span class="stocks-dock-label" aria-hidden="true">Stocks · Last 7 days</span>
      </header><div id="viewModeBar" class="view-mode-bar">
        <p id="viewModeHint" class="view-mode-hint"></p>
        <div id="newsViewSwitch" class="view-mode-switch" role="group" aria-label="News view" hidden><button type="button" data-news-view="desk" aria-pressed="true">Connection desk</button><button type="button" data-news-view="feed" aria-pressed="false">Full feed</button></div>
        <div class="view-mode-switch" role="group" aria-label="Page detail level"><button type="button" data-view-mode="simple" aria-pressed="true">Simple</button><button type="button" data-view-mode="advanced" aria-pressed="false">Advanced</button></div>
      </div>
      <div class="events-sort-bar"><div id="eventSortOptions" class="events-sort-segmented" role="group" aria-label="Sort clusters">
            <button type="button" class="md-btn md-btn--tonal" data-event-sort="size" title="Largest clusters first">Size</button>
            <button type="button" class="md-btn md-btn--tonal" data-event-sort="positive" title="Most positive scores first">Positive</button>
            <button type="button" class="md-btn md-btn--tonal" data-event-sort="negative" title="Most negative scores first">Negative</button>
            <button type="button" class="md-btn md-btn--tonal is-active" data-event-sort="impact" title="Largest absolute scores first, regardless of sign" aria-pressed="true">Impact</button>
          </div></div><section id="simpleView" class="simple-page" hidden></section><section id="dashboardView" class="dashboard-page hidden"></section><section id="eventsView" class="hidden"></section><section id="stocksView" class="stocks-page hidden"></section><section id="connectionsView" class="hidden"></section><section id="atlasView" class="atlas-page hidden"></section><section id="daysView" class="hidden"></section><section id="watchlistView" class="watchlist-page hidden"></section>
<section id="weeklyView" class="weekly-page hidden"><header class="weekly-heading"><h1>Trends</h1><p>Last seven days</p></header><div id="weeklyAiSummary"></div><div id="weeklySummary" class="weekly-summary"></div><div id="weeklyChart"></div><div id="weeklyList" class="weekly-list"></div></section>
<section id="mapView" class="hidden"><header class="globe-heading"><h1>World</h1><span id="globeCount"></span></header><div class="globe-layout"><div class="globe-stage"><canvas id="map" class="globe-canvas" tabindex="0"></canvas><div id="globeTooltip" hidden></div><div class="globe-controls"><button data-globe-zoom="in">+</button><button data-globe-zoom="out">−</button><button data-globe-reset>Reset</button></div><p id="globeStatus" class="globe-hint">Drag to rotate · select a marker</p></div><div class="globe-sidebar"><h2>Locations</h2><div id="countryPanel" class="country-panel"></div><div id="countryArticles" class="country-articles"></div></div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/d3-array@3.2.4/dist/d3-array.min.js"></script><script src="https://cdn.jsdelivr.net/npm/d3-geo@3.1.1/dist/d3-geo.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script><script src="js/util.js"></script><script src="js/cluster-taxonomy.js"></script>
<script>
window.errors=[];window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
window.ClustrConfig={SUPABASE_URL:'https://fixture.invalid',SUPABASE_ANON_KEY:'fixture',COUNTRY_COORDS:{'United States':[38,-97],Norway:[60,8],China:[35,105]}};window.ClustrAuth={accessToken:()=> 'fixture'};
const originalFetch=window.fetch;let saved=[{symbol:'NVDA',name:'NVIDIA',market:'US'},{symbol:'JPM',name:'JPMorgan',market:'US'},{symbol:'MSFT',name:'Microsoft',market:'US'}];window.fetch=async(url,options={})=>{if(String(url).startsWith('https://fixture.invalid')){if(options.method==='POST')saved.push(JSON.parse(options.body));if(options.method==='DELETE'){const symbol=new URL(url).searchParams.get('symbol')?.slice(3);saved=saved.filter(s=>s.symbol!==symbol);}return {ok:true,status:options.method&&options.method!=='GET'?204:200,json:async()=>saved};}return originalFetch(url,options);};
const titles=['AI infrastructure','Energy supply','Cybersecurity','Banking','Global shipping','Healthcare'];const symbols=['NVDA','XOM','CRWD','JPM','MSFT','JNJ'];const pubs=Array.from({length:16},(_,i)=>{const at=new Date(Date.now()-i*12*3600000);return {id:100-i,market:'US',title:'US publish '+at.toLocaleString(),created_at:at.toISOString(),groups_json:titles.map((name,j)=>({name,market:'US',stance_score:(j%2?-1:1)*(2+j/2+i*.08),time_horizon:'weeks',reason:'Sample report context links this theme to companies, earnings and market demand.',fixed_stocks:[{symbol:symbols[j],name:symbols[j],priceAtPublish:150-i}],mentioned_stocks:[{symbol:symbols[j],name:symbols[j],priceAtPublish:150-i}],articles:Array.from({length:7},(_,k)=>({title:name+': sample development '+(k+1),source:['Company filing','BBC','CNBC'][k%3],rating:j%2?-3:4,short_summary:'Sample article context for checking the chosen layout. This is not current news.',primary_country:['United States','Norway','China'][k%3],link:'https://example.com/story/'+j+'/'+k,mentioned_companies:[{symbol:symbols[j],name:symbols[j]}]}))}))}});
let index=0;window.ClustrApi={fetchAllPublishes:async()=>pubs,fetchHistorySummaries:async()=>pubs,fetchPublishesInRange:async(start,end)=>pubs.filter(p=>Date.parse(p.created_at)>=Date.parse(start)&&Date.parse(p.created_at)<=Date.parse(end)),loadGroupsForPublish:async p=>p.groups_json,fetchAiSummaries:async()=>[]};window.ClustrQuotes={getLatestQuotes:async list=>Object.fromEntries(list.map(symbol=>[symbol,{price:155.32,changePercent:symbol==='JPM'?-.84:1.42,asOf:new Date().toISOString()}])),getQuotes:async list=>Object.fromEntries(list.map(symbol=>[symbol,{price:155.32}]))};
window.ClustrApp={getPublishes:()=>pubs,getPublishIndex:()=>index,getGroups:()=>pubs[index].groups_json,getAllGroups:()=>pubs[index].groups_json,getGroupsCache:()=>Object.fromEntries(pubs.map(p=>[p.id,p.groups_json])),showView:view=>preview(view),stepPublish:async delta=>{index+=delta},isAccountPreview:()=>false};
</script>
<script src="js/watchlist.js"></script><script src="js/stocks.js"></script><script src="atlas/atlas.js"></script><script src="dashboard/regression.js"></script><script src="vendor/gridstack-14.1.0/gridstack-all.js"></script><script src="dashboard/workspace.js"></script><script src="dashboard/dashboard.js"></script><script src="connections/canvas.js"></script><script src="connections/connections.js"></script><script src="js/map.js"></script><script src="js/render.js"></script><script src="js/simple-view.js"></script>
<script>
async function preview(view){document.documentElement.dataset.activeView=view;ClustrConnections.hide();ClustrStocks.leave();document.querySelectorAll('.main>section').forEach(e=>e.classList.add('hidden'));document.getElementById('simpleView').classList.remove('hidden');const host=document.getElementById({map:'mapView',dashboard:'dashboardView',events:'eventsView',stocks:'stocksView',connections:'connectionsView',weekly:'weeklyView',atlas:'atlasView',days:'daysView',watchlist:'watchlistView'}[view]);host.classList.remove('hidden');ClustrWatchlist.setView(view);ClustrSimple.render(view);
if(view==='dashboard')await ClustrDashboard.render(host,preview);if(view==='stocks')ClustrStocks.mount(host,'pro');if(view==='watchlist')ClustrWatchlist.mount(host);if(view==='atlas')await ClustrAtlas.render(host);if(view==='connections')await ClustrConnections.mount(pubs[index].groups_json,pubs[index]);if(view==='map'){ClustrRender.renderCountryPanel(pubs[index].groups_json,c=>{ClustrMap.focusCountry(c);ClustrRender.renderCountryArticles(pubs[index].groups_json,c)});ClustrMap.render(pubs[index].groups_json,{onCountry:c=>ClustrRender.renderCountryArticles(pubs[index].groups_json,c)});ClustrRender.renderCountryArticles(pubs[index].groups_json,'United States');}if(view==='days')ClustrSimple.setReports(pubs.map((publish,index)=>({publish:{...publish,__clusterCount:6},index})));
if(view==='weekly'){const days=[...new Map(pubs.slice(0,14).map(p=>[ClustrSimple.etDay(p.created_at),{day:ClustrSimple.etDay(p.created_at),scores:[3,4,-2],stories:new Set([1,2,3])}])).values()].reverse();const clusters=titles.map((name,j)=>({name,key:name,days:new Set(days.map(d=>d.day)),items:pubs.slice(0,7).map(p=>({group:p.groups_json[j],publish:p}))}));document.getElementById('weeklyList').innerHTML=clusters.map(c=>`<details class="weekly-cluster" data-weekly-key="${c.key}"><summary class="weekly-cluster-head"><span class="weekly-cluster-score">+4</span><div class="weekly-cluster-main"><h3>${c.name}</h3><p>7 days · 8 unique stories</p></div><span>⌄</span></summary><div class="weekly-cluster-history">Sample weekly context and saved articles.</div></details>`).join('');ClustrSimple.prepareWeekly(days,clusters);}
window.readyView=view;}
ClustrWatchlist.init({id:'preview'}).then(()=>preview(new URLSearchParams(location.search).get('view')||'events'));document.querySelector('.preview-nav').onclick=e=>{if(e.target.dataset.preview)preview(e.target.dataset.preview)};
</script><script src="js/mobile-ui.js"></script><script>
const originalPreview=preview;preview=async view=>{await originalPreview(view);document.getElementById('viewModeBar').hidden=!['events','stocks','dashboard','atlas'].includes(view);document.getElementById('newsViewSwitch').hidden=view!=='events';document.getElementById('meta').innerHTML='<span class="publish-meta-mobile"><span>US · Nov 9</span><span>3:00 PM ET</span></span>';};
document.querySelectorAll('button[data-view-mode]').forEach(b=>b.onclick=()=>{document.documentElement.dataset.viewMode=b.dataset.viewMode;preview(document.documentElement.dataset.activeView);});
preview(new URLSearchParams(location.search).get('view')||'events');
</script></body></html>
