<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cumulative stance chart QA</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../dashboard/dashboard.css"><link rel="stylesheet" href="../stance-history.css">
<style>body{margin:0;padding:20px;font-family:system-ui,sans-serif}article{max-width:920px;margin:20px auto;padding:20px;border:1px solid var(--border);border-radius:16px}h2{margin:0 0 10px}.demo-note{font-size:12px;color:var(--text-meta)}@media(max-width:540px){body{padding:10px}article{margin:5px 0;padding:12px}}</style></head>
<body><article><h2>Stance × cluster defaults</h2><p class="demo-note">QA preview — fictional data, no real stocks or account data.</p><div id="chart"></div></article>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script><script src="../js/util.js"></script>
<script>
fetch('../js/render.js').then(response=>response.text()).then(source=>{
  new Function(source.replace('  window.ClustrRender = {','  window.ChartPreview = { mountStanceHistory, stanceChartShellHtml };\n  window.ClustrRender = {'))();
  const rows=[-6,-6,2,1,-3,5,4,4].map((stanceScore,index)=>({date:new Date(Date.now()-(8-index)*86400000).toISOString(),stanceScore,defaultRet:[2,-1,3,-2,1,2,-1,.5][index],priceBasis:index===7?'latest quote':'next',sampleN:index===3?2:3,totalN:3}));
  const host=document.getElementById('chart');host.innerHTML=ChartPreview.stanceChartShellHtml();ChartPreview.mountStanceHistory(host,rows);
});
</script></body></html>
